# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: opusdns

before:
  hooks:
    # Check, never rewrite: a release must build exactly the tagged go.mod.
    - go mod tidy -diff

builds:
  - id: opusdns
    main: ./cmd/opusdns
    binary: opusdns
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/opusdns/opusdns-go-client/opusdns.Version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # One line on purpose: a folded block scalar joins its lines with spaces,
    # which ended up inside the archive names.
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: OpusDNS
    name: opusdns-go-client
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
