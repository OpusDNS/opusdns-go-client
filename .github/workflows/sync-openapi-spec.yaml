name: Sync OpenAPI Spec

# Refreshes the vendored OpenAPI document in spec/ from the published public
# spec and opens a PR with the diff.
#
# This client is hand-written, so a new endpoint needs code, not just a new
# spec file. TestSpecCoverage turns that into a build failure by requiring every
# operation to be triaged in spec/coverage.yaml, and the PR body carries the
# report plus ready-to-paste manifest stubs. See SPEC_SYNC.md.
#
# Normally driven by a repository_dispatch from OpusDNS/api-spec, which fires
# only when the published spec actually changed. The weekly run is a safety net
# for a lost dispatch.

on:
  repository_dispatch:
    types: [openapi_spec_update]
  workflow_dispatch:
    inputs:
      spec_ref:
        description: api-spec ref to vendor the spec from
        required: false
        default: main
  schedule:
    - cron: "30 5 * * 1" # weekly safety net (Mondays 05:30 UTC)

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # api-spec commits the new spec first and bumps the npm version afterwards, so
  # the dispatched sha is a fine source for the document. specsync reads the npm
  # version from main regardless.
  SPEC_REF: ${{ github.event.client_payload.ref || github.event.inputs.spec_ref || 'main' }}
  # Pinned so the report is reproducible. Do not drop below 0.2.2, which fixed
  # spurious oneOf diffs (pb33f/openapi-changes#235).
  OPENAPI_CHANGES_VERSION: 0.2.10

jobs:
  sync:
    name: Sync
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Record current spec version
        id: before
        run: |
          {
            echo "npm=$(sed -n 's/^npm_version: //p' spec/version.yaml)"
            echo "info=$(sed -n 's/^info_version: //p' spec/version.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh vendored spec
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make spec-sync SPEC_REF="$SPEC_REF"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet --exit-code -- spec/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Vendored spec is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read new spec version
        if: steps.diff.outputs.changed == 'true'
        id: after
        run: |
          {
            echo "npm=$(sed -n 's/^npm_version: //p' spec/version.yaml)"
            echo "info=$(sed -n 's/^info_version: //p' spec/version.yaml)"
            echo "commit=$(sed -n 's/^api_spec_commit: //p' spec/version.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Install openapi-changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          export VERSION="$OPENAPI_CHANGES_VERSION"
          curl -fsSL https://pb33f.io/openapi-changes/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Summarise spec changes
        if: steps.diff.outputs.changed == 'true'
        id: changelog
        run: |
          git show HEAD:spec/openapi.yaml > "$RUNNER_TEMP/spec-old.yaml"
          openapi-changes summary --markdown --no-color --no-logo \
            "$RUNNER_TEMP/spec-old.yaml" spec/openapi.yaml \
            > "$RUNNER_TEMP/summary.md" || true
          {
            echo "report<<SPEC_REPORT_EOF"
            head -c 60000 "$RUNNER_TEMP/summary.md"
            echo
            echo SPEC_REPORT_EOF
          } >> "$GITHUB_OUTPUT"

      # Reported, never gated: a red coverage test is the expected state of this
      # PR until somebody triages the new operations. CI on the PR is the gate.
      - name: Report coverage drift
        if: steps.diff.outputs.changed == 'true'
        id: coverage
        run: |
          go test ./opusdns -run 'TestSpecCoverage|TestSpecModels' -v \
            > "$RUNNER_TEMP/coverage.txt" 2>&1 || true
          {
            echo "report<<COVERAGE_EOF"
            grep -E '(UNMAPPED|STALE|MISMATCH|ORPHAN|UNCLAIMED|MISSING|DROPPED|WARN|spec 20)' \
              "$RUNNER_TEMP/coverage.txt" | sed 's/^ *[a-z_]*\.go:[0-9]*: //' | head -c 20000
            echo
            echo COVERAGE_EOF
            echo "stubs<<STUBS_EOF"
            sed -n '/--- STUBS/,/--- END STUBS/p' "$RUNNER_TEMP/coverage.txt" | \
              sed 's/^ *//' | head -c 20000
            echo
            echo STUBS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Rebase on latest main
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Keep the bot branch based on current origin/main, otherwise the PR
          # looks like it reverts commits landed since checkout.
          git fetch origin main
          git stash push --include-untracked -- spec/
          git reset --hard origin/main
          git stash pop

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # A PAT, not GITHUB_TOKEN: GitHub suppresses workflow runs for PRs
          # opened by GITHUB_TOKEN, and the point of this PR is that CI runs the
          # coverage test against the new spec. Same secret name that api-spec
          # uses to dispatch here; scoped to this repo only.
          token: ${{ secrets.GH_PAT_OPENAPI_OPUSDNS_GO_CLIENT }}
          add-paths: spec/
          branch: bot/openapi-spec-sync
          commit-message: "chore(spec): sync OpenAPI spec (npm ${{ steps.after.outputs.npm }})"
          title: "chore(spec): sync OpenAPI spec (npm ${{ steps.before.outputs.npm }} → ${{ steps.after.outputs.npm }})"
          body: |
            Refreshes the vendored OpenAPI document from the published public spec.

            | | |
            |---|---|
            | npm version | `${{ steps.before.outputs.npm }}` → `${{ steps.after.outputs.npm }}` |
            | Spec version | `${{ steps.before.outputs.info }}` → `${{ steps.after.outputs.info }}` |
            | api-spec commit | `${{ steps.after.outputs.commit }}` |
            | Trigger | `${{ github.event_name }}` |

            **CI on this PR is expected to fail while new operations are untriaged.**
            That failure is the to-do list. To clear it:

            - [ ] Read the OpenAPI changes report below for behaviour changes that do
                  not add or remove an operation (new required fields, changed types,
                  new enum values, new status codes).
            - [ ] Paste the stubs below into `spec/coverage.yaml` and give every entry
                  a real status: `implemented` (with the Go method), `deferred` (in
                  scope, with a reason) or `excluded` (out of scope, with a reason).
            - [ ] Fix any `STALE`, `MISMATCH` or `ORPHAN` line. Those mean the client
                  calls a route the API no longer serves.
            - [ ] Fix any `DROPPED` line. Those are struct fields the API stopped
                  sending, which now silently decode to the zero value.
            - [ ] Run `make spec-check` until it is green.

            <details><summary>Coverage report</summary>

            ```
            ${{ steps.coverage.outputs.report }}
            ```

            </details>

            <details><summary>Manifest stubs</summary>

            ```yaml
            ${{ steps.coverage.outputs.stubs }}
            ```

            </details>

            <details><summary>OpenAPI changes report</summary>

            ${{ steps.changelog.outputs.report }}

            </details>
          labels: |
            automated
            openapi-spec
          delete-branch: true
