name: Check OpenAPI Spec

# Reports when the published OpenAPI specification has moved past the copy
# vendored in spec/, and what that costs this client in code.
#
# Deliberately read-only: it needs no token beyond the built-in one, opens no
# pull request and pushes nothing. When it fails, the whole report is in the run
# summary, and `make spec-update` locally reproduces it and applies the refresh.
#
# The drift protection itself does not live here. TestSpecCoverage and
# TestSpecModels run in the normal test job on every pull request, against the
# vendored spec. This job is what notices that the vendored spec is itself
# behind, which no amount of local testing can tell you.

on:
  schedule:
    - cron: "30 5 * * 1" # weekly (Mondays 05:30 UTC)
  workflow_dispatch:
    inputs:
      spec_ref:
        description: api-spec ref to compare against
        required: false
        default: main
  # Fires only if api-spec is ever given a token to dispatch here. Harmless
  # until then; the weekly run is the normal path.
  repository_dispatch:
    types: [openapi_spec_update]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  SPEC_REF: ${{ github.event.client_payload.ref || github.event.inputs.spec_ref || 'main' }}
  # Pinned so the report is reproducible. Do not drop below 0.2.2, which fixed
  # spurious oneOf diffs (pb33f/openapi-changes#235).
  OPENAPI_CHANGES_VERSION: 0.2.10

jobs:
  check:
    name: Check
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Record vendored spec version
        id: before
        run: |
          {
            echo "npm=$(sed -n 's/^npm_version: //p' spec/version.yaml)"
            echo "info=$(sed -n 's/^info_version: //p' spec/version.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh the vendored spec
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp spec/openapi.yaml "$RUNNER_TEMP/spec-old.yaml"
          make spec-sync SPEC_REF="$SPEC_REF"

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet --exit-code -- spec/openapi.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "npm=$(sed -n 's/^npm_version: //p' spec/version.yaml)"
            echo "info=$(sed -n 's/^info_version: //p' spec/version.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Check the client against the refreshed spec
        id: coverage
        run: |
          if go test ./opusdns -run 'TestSpecCoverage|TestSpecModels' -v \
              > "$RUNNER_TEMP/coverage.txt" 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise spec changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          export INSTALL_DIR="$HOME/.local/bin"
          export VERSION="$OPENAPI_CHANGES_VERSION"
          curl -fsSL https://pb33f.io/openapi-changes/install.sh | sh
          "$HOME/.local/bin/openapi-changes" summary --markdown --no-color --no-logo \
            "$RUNNER_TEMP/spec-old.yaml" spec/openapi.yaml \
            > "$RUNNER_TEMP/summary.md" || true

      - name: Write the report
        if: always()
        run: |
          {
            echo "## OpenAPI spec drift"
            echo
            echo "| | vendored | published |"
            echo "|---|---|---|"
            echo "| npm version | \`${{ steps.before.outputs.npm }}\` | \`${{ steps.diff.outputs.npm }}\` |"
            echo "| spec version | \`${{ steps.before.outputs.info }}\` | \`${{ steps.diff.outputs.info }}\` |"
            echo

            if [ "${{ steps.diff.outputs.changed }}" = 'true' ]; then
              echo "Reproduce and apply locally:"
              echo
              echo '```'
              echo "make spec-update"
              echo '```'
            else
              echo "The vendored spec is current."
            fi
            echo

            echo "### Coverage and model check"
            echo
            echo '```'
            grep -E '(UNMAPPED|STALE|MISMATCH|ORPHAN|UNCLAIMED|MISSING|DROPPED|WARN|spec 20)' \
              "$RUNNER_TEMP/coverage.txt" | sed 's/^ *[a-z_]*\.go:[0-9]*: //' | head -c 20000
            echo '```'
            echo

            if grep -q '^--- STUBS' "$RUNNER_TEMP/coverage.txt"; then
              echo "<details><summary>Paste into spec/coverage.yaml</summary>"
              echo
              echo '```yaml'
              # No de-indenting: the test writes this block to stdout precisely
              # so its YAML indentation survives.
              sed -n '/^--- STUBS/,/^--- END STUBS/p' "$RUNNER_TEMP/coverage.txt" | head -c 20000
              echo '```'
              echo
              echo "</details>"
              echo
            fi

            if [ -s "$RUNNER_TEMP/summary.md" ]; then
              echo "<details><summary>OpenAPI changes report</summary>"
              echo
              head -c 60000 "$RUNNER_TEMP/summary.md"
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The refreshed spec is attached so a reviewer can read the diff without
      # fetching anything themselves.
      - name: Upload the refreshed spec
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-${{ steps.diff.outputs.info }}
          path: |
            spec/openapi.yaml
            spec/version.yaml
          retention-days: 30

      # Fail loudly. A red scheduled run is the notification: GitHub mails it to
      # whoever last touched the cron in this file, and it is visible in the
      # Actions tab. Nothing else here reaches out.
      - name: Fail when the client is behind
        if: steps.diff.outputs.changed == 'true' || steps.coverage.outputs.passed == 'false'
        run: |
          echo "::error::api-spec has moved past the vendored copy, or the client no longer matches it. See the run summary; run \`make spec-update\` locally."
          exit 1
