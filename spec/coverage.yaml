# Which OpusDNS API operations this client binds.
#
# Every operation in spec/openapi.yaml must appear here exactly once, so a newly
# published endpoint fails the build until somebody decides what to do with it.
# Keys are "METHOD /path" copied verbatim from the spec.
#
#   implemented  bound by the library; `method` names the Go method that builds
#                the path (further entries are wrappers over it)
#   deferred     not bound yet, but in scope; `reason` says why it is waiting
#   excluded     deliberately out of scope; `reason` says why
#
# See SPEC_SYNC.md. Regenerate stubs for new operations with `make spec-stubs`.
version: 1

